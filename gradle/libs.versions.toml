[versions]
agp = "9.2.1"
coreKtx = "1.19.1"
junit4 = "4.13.2"
junitJupiter = "5.14.4"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.09.00"
detekt = "1.23.8"
ktlintPlugin = "14.2.0"
retrofit = "3.0.0"
okhttp = "5.5.0"
kotlinxSerialization = "1.9.0"
